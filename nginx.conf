# Config do nginx para servir o Flutter web (Single Page Application).
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Garante o MIME correto do WebAssembly (CanvasKit usa .wasm).
    types {
        application/wasm wasm;
    }

    # Compressao para reduzir o tamanho de transferencia.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/wasm;

    # Roteamento de SPA: qualquer rota desconhecida cai no index.html,
    # deixando o roteador do Flutter resolver.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nao cacheia o index.html nem o service worker (para pegar novos deploys).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    # Cacheia agressivamente os assets versionados do build.
    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
